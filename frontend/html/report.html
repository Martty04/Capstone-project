<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SafeReach - Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
  <link rel="icon" type="image/png" href="../images/flag.png">
<link rel="stylesheet" href="../css/report.css">
</head>
<body>

<!-- =========================
MOBILE / SIDEBAR OVERLAY
========================== -->
<div class="overlay"id="overlay"></div>


<!-- =========================
DASHBOARD
========================== -->
<div class="dashboard">


<!-- =========================
SIDEBAR
========================== -->
<aside
class="sidebar"id="sidebar">

<!-- Logo -->
<div class="logo">

<a href="index.html"> <img src="../images/logo.png" class="shield" alt="SafeReach Logo"></a>
<a href="index.html"><img src="../images/logo1.png" class="shield1" alt="SafeReach Logo"></a>

</div>


<!-- Sidebar Close -->
 <button class="close-btn" onclick="closeSidebar()">&times;</button>



<!-- Navigation -->
<nav class="menu">
<a href="dashboard.html" >
<img class="dash-ic" src="../images/dashboardicon.png" alt="Dashboard"/>
<span class="vanish" id="van"> Dashboard</span>
</a>


<a href="report.html" class="active">

<img class="dash-ic" src="../images/reporticon.png" alt="Report"/>
<span class="vanish" id="van"> Report</span>
</a>


<a href="alerts.html">
<img class="dash-ic" src="../images/alerticon.png" alt="Alerts"/>
<span class="vanish" id="van"> Alerts</span>
</a>


<a href="resources.html">
<img class="dash-ic" src="../images/resourceicon.png" alt="Resources"/>
<span class="vanish" id="van"> Resources</span>
</a>


<a href="settings.html">
<img class="dash-ic" src="../images/setting icon.png" alt="Settings">
<span class="vanish" id="van"> Settings</span>
</a>
</nav>


<!-- Sidebar Bottom -->
<div class="sidebar-bottom">

  <button class="quick-btn">
    <i class="fa-solid fa-circle-plus"></i> Quick Report</button>
  <a href="#" class="tin" id="tinz">
    <i class="fa-regular fa-circle-question"></i>
    <span class="offf ou">Support</span>
  </a>


  <a href="login.html" class="tin tina" id="tinz">
    <i class="fa-solid fa-arrow-right-from-bracket"></i>
   <span class="offf">Log Out</span>
  </a>
</div>
</aside>



<!-- =========================
MAIN
========================== -->
<main class="main">


<!-- =========================
TOPBAR
========================== -->
<header class="topbar">


<!-- Mobile Header Row -->
<div class="mobile-header">

<!-- Mobile Logo -->
<img src="../images/logo.png" class="mobile-logo" alt="SafeReach">


<!-- Hamburger -->
<button class="menu-toggle" id="menuToggle" aria-label="Open menu">

<span></span>
<span></span>
<span></span>

</button>

</div>


<!-- Desktop Right -->
<div class="top-right">

<!-- Notification -->
<button class="notification-btn" aria-label="Notifications">

<img class="notify" src="../images/notification.png" alt="Notifications">

</button>


<!-- Profile -->
<div class="profile">

<div class="profile-info">

<strong>
Sarah Mitchell
</strong>

<small>
Verified Resident
</small>
</div>


<img src="https://i.pravatar.cc/40?img=32" alt="Sarah Mitchell">
</div>
</div>
</header>


<section class="content">

<!-- Progress -->
<div class="steps">

<div class="step active">
<div class="step-num">1</div>
<span>Category</span>
</div>

<div class="line"></div>

<div class="step">
<div class="step-num">2</div>
<span>Details</span>
</div>

<div class="line"></div>

<div class="step">
<div class="step-num">3</div>
<span>Evidence</span>
</div>

</div>

<!-- Card -->
<div class="card">

<h2>What happened?</h2>

<p class="sub">
Select the most accurate category for the incident you are reporting.
</p>

<div class="categories">

<button class="cat active">
<img class="icon" src="../images/fire.png" alt="fire"/>
<span>Fire</span>
</button>

<button class="cat">
<img class="icon" src="../images/crime.png" alt="fire"/>
<span>Crime</span>
</button>

<button class="cat">
<img class="icon" src="../images/accident.png" alt="fire"/>
<span>Accident</span>
</button>

<button class="cat">
<img class="icon" src="../images/medical.png" alt="fire"/>
<span>Medical</span>
</button>

<button class="cat">
<img class="icon" src="../images/other.png" alt="fire"/>
<span>Other</span>
</button>

</div>

<div class="actions">
<a href="report-details.html" class="continue-btn">
Continue →
</a>
</div>

</div>

</section>

</main>

</div>
<script src="../js/script.js"></script>
</body>
</html>
